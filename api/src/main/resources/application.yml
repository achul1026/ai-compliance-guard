spring:
  application:
    name: ai-compliance-guard
  # Phase 0 기본 프로파일에서는 DB 없이도 기동 가능하도록
  # DataSource/JPA/Flyway autoconfigure를 제외한다.
  # 로컬 통합 테스트 시 SPRING_PROFILES_ACTIVE=local 로 활성화한다.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

server:
  port: 8080
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health, info

app:
  version: 0.1.0-SNAPSHOT

# P1-5: 임베딩 파이프라인 (RAG-002)
pipeline:
  chunks-jsonl-path: ${PIPELINE_CHUNKS_JSONL_PATH:_workspace/regulations_chunks.jsonl}
  embedding-batch-size: ${PIPELINE_EMBEDDING_BATCH_SIZE:32}
  max-retries: ${PIPELINE_MAX_RETRIES:3}
  source-tag: ${PIPELINE_SOURCE_TAG:DATA-002}

# ADR-005: 임베딩 프로바이더 토글
embedding:
  # bge-m3 (기본, FastAPI 로컬 추론 서버) 또는 upstage
  provider: ${EMBEDDING_PROVIDER:bge-m3}
  bge-m3:
    url: ${EMBEDDING_BGE_M3_URL:http://localhost:8001}
    model-name: ${EMBEDDING_BGE_M3_MODEL:BAAI/bge-m3}
    dimension: ${EMBEDDING_BGE_M3_DIMENSION:1024}
    batch-size: ${EMBEDDING_BGE_M3_BATCH_SIZE:32}
    normalize: ${EMBEDDING_BGE_M3_NORMALIZE:true}

# P1-5: Upstage API 설정 (embedding.provider=upstage 일 때 활성)
upstage:
  api-key: ${UPSTAGE_API_KEY:placeholder_key}
  embedding-model: ${UPSTAGE_EMBEDDING_MODEL:solar-embedding-1-large-passage}
  api-url: ${UPSTAGE_API_URL:https://api.upstage.ai/v1/embeddings}
  embedding-dimension: ${UPSTAGE_EMBEDDING_DIMENSION:4096}
  timeout-seconds: ${UPSTAGE_TIMEOUT_SECONDS:30}
  batch-size: ${UPSTAGE_BATCH_SIZE:20}
  max-retries: ${UPSTAGE_MAX_RETRIES:3}
  # D4: Upstage Solar-reranker
  reranker-model: ${UPSTAGE_RERANKER_MODEL:solar-1-reranker}
  reranker-url: ${UPSTAGE_RERANKER_URL:https://api.upstage.ai/v1/ranking}

# ADR-006 (D5): LLM 프로바이더 토글 — mock(기본, 호출 0건) | gemini(무료 티어)
agent:
  llm:
    provider: ${AGENT_LLM_PROVIDER:mock}
    gemini:
      api-key: ${GEMINI_API_KEY:placeholder_key}
      model: ${GEMINI_MODEL:gemini-flash-latest}
      temperature: ${GEMINI_TEMPERATURE:0.2}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:60}
      max-retries: ${GEMINI_MAX_RETRIES:2}

logging:
  level:
    root: INFO
    com.achul.compliance: DEBUG
